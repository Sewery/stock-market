services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_market
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgres://stock:stock@postgres:5432/stock_market?sslmode=disable
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - ./:/app