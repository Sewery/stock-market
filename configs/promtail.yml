server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    external_labels:
      job: docker

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      - action: replace
        target_label: job
        replacement: docker

      - action: replace
        target_label: app
        replacement: stock-market

      - action: replace
        source_labels: [__meta_docker_container_name]
        target_label: container

      - action: keep
        source_labels: [__meta_docker_container_name]
        regex: ".*app.*"