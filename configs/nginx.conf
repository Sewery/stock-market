events {}

http {
  upstream stock_market_app {
    server app1:8080;
    server app2:8080;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://stock_market_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}